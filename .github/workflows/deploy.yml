name: CI/CD

# 分支 push：仅静态分析；tag push：静态分析 + 在 Actions 编译 Linux 二进制 + rsync + 部署机打包镜像并运行
# 容器名：qq-bot-server
# 端口映射：127.0.0.1:8090 -> 容器 8090（hfut 反向调用 internal API 用，由宿主机 nginx 反代到 https://bot.xiaoen.xyz；不暴露公网，详见 skill/bot/SKILL.md "绑定 QQ 流程"段）
# 配置走 HFUT 模式：宿主机 /qq-bot-server/.env -> docker run --env-file，YAML 不进容器
permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main, master]
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. 静态分析（分支与 tag 均执行；不编译）
  check:
    name: 1. 静态分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: 静态分析
        run: go vet ./...

  # 2. 部署（仅 tag：Actions 编译 build/app，部署机 docker build 打包容器）
  deploy:
    name: 2. 部署
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: 编译 Linux 二进制
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/app .

      # 在 GitHub Actions runner（云端 2vCPU/7GB 免费）上做完整 docker build——
      # 让部署机彻底不参与 build，避免 apt-get install / pip install jmcomic 把
      # 4GB 部署机打满（曾导致 sshd 心跳被压死 → SSH client_loop disconnect）。
      #
      # build_arg 显式传国际源（archive.ubuntu.com / pypi.org），让 runner 走最快路径；
      # Dockerfile 默认的 mirrors.aliyun.com 是面向国内部署机优化的，在 runner 上反而慢。
      #
      # docker save 输出整个镜像 (含 ubuntu base + python + pip 依赖 + Go binary)，
      # 用 gzip -1 轻量压缩（速度 > 压缩率，避免占用 runner CPU 太久），单文件 ~250MB。
      - name: 在 runner 构建 Docker 镜像并保存为 tar
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          export DOCKER_BUILDKIT=1
          docker build \
            --build-arg APT_MIRROR=archive.ubuntu.com \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple/ \
            --build-arg PIP_TRUSTED_HOST=pypi.org \
            -t "qq-bot-server:${TAG}" -t qq-bot-server:latest \
            -f Dockerfile .
          docker save qq-bot-server:${TAG} qq-bot-server:latest | gzip -1 > qq-bot-server.tar.gz
          echo "[runner] 镜像 tar 体积："
          ls -lh qq-bot-server.tar.gz

      - name: 同步镜像 tar 到部署机并切换容器（部署机仅 load + run，不做 build）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          [ -n "$DEPLOY_HOST" ] || { echo "::error::缺少 Secrets: DEPLOY_HOST"; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::缺少 Secrets: DEPLOY_USER"; exit 1; }
          [ -n "$DEPLOY_SSH_KEY$DEPLOY_SSH_KEY_B64" ] || { echo "::error::缺少 Secrets: 至少配置 DEPLOY_SSH_KEY 或 DEPLOY_SSH_KEY_B64"; exit 1; }

          mkdir -p ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY_B64" ]; then
            echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "私钥格式无效"; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # rsync 默认走 ssh，但不会自动用 -i；须与 SSH_BASE 使用同一私钥，否则会 publickey 失败
          RSYNC_RSH='ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes'
          SSH_BASE=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}")

          echo "[1/3] 解析部署目录..."
          REMOTE_DEST=$("${SSH_BASE[@]}" bash -s << EOF
          export DEPLOY_PATH='${DEPLOY_PATH}'
          printf '%s' "\${DEPLOY_PATH:-\$HOME/qq-bot-server}"
          EOF
          )
          REMOTE_DEST=$(printf '%s' "$REMOTE_DEST" | tr -d '\r\n')
          echo "远程目录: $REMOTE_DEST"

          echo "[2/3] rsync 镜像 tar（约 250MB）到部署机..."
          "${SSH_BASE[@]}" "mkdir -p $(printf '%q' "$REMOTE_DEST")"
          # 只传镜像 tar——部署机不再需要 Dockerfile / build/app / package/jmoption
          # 这些都已经打进镜像。--partial 让中断的传输可续传（GH→部署机偶发抖动时少重传）。
          rsync -av --partial --inplace \
            -e "$RSYNC_RSH" \
            qq-bot-server.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DEST}/qq-bot-server.tar.gz"

          echo "[3/3] 部署机 docker load + 切换容器（不再做 build，资源占用降到最小）..."
          "${SSH_BASE[@]}" bash -s << EOF
          set -e
          DEST="\${DEPLOY_PATH:-\$HOME/qq-bot-server}"
          cd "\$DEST"

          # /qq-bot-server/.env：必须先在宿主机准备好（含 SERVER_ADDRESS、SERVER_ACCESS_TOKEN 等，参考 deploy/env.production.example）
          ENV_FILE='/qq-bot-server/.env'
          [ -f "\$ENV_FILE" ] || { echo "::error::需先在宿主机创建 \$ENV_FILE 并填入环境变量（参考 deploy/env.production.example）"; exit 1; }
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "\$ENV_FILE" > /tmp/.env.qq-bot.docker
          [ -s /tmp/.env.qq-bot.docker ] || { echo '::error::env 文件中无有效 KEY=VALUE 行'; exit 1; }

          # 持久化目录：宿主机 /qq-bot-server/cache 一次性挂到容器 /tmp/qq-bot
          # 容器内 jm 下载 -> /tmp/qq-bot/jm，pdf 缓存 -> /tmp/qq-bot/pdf，日志 -> /tmp/qq-bot/logs
          mkdir -p /qq-bot-server/cache/jm /qq-bot-server/cache/pdf /qq-bot-server/cache/logs
          chmod -R 755 /qq-bot-server/cache

          # docker load：从 rsync 过来的 tar 加载到本地 image cache。
          # 这步只是磁盘 IO + tar 解压（gzip），单核 CPU 短时占用、内存占用 <100MB，
          # 不再像 apt+pip 那样烧 1GB+ 内存——这正是方案 1 的意义。
          # 旧 qq-bot-server 容器**保持运行**，直到下方 docker stop 才停。
          echo "[deploy] docker load < qq-bot-server.tar.gz ..."
          gunzip -c qq-bot-server.tar.gz | docker load

          # 切换窗口：stop 旧 → rm → run 新，整段 < 5 秒
          docker stop qq-bot-server 2>/dev/null || true
          docker rm qq-bot-server 2>/dev/null || true

          # 端口映射：127.0.0.1:8090（仅本机，不暴露公网；nginx 反代到 https://bot.xiaoen.xyz）
          # 优先读 .env 里的 BOT_INTERNAL_API_PORT 让宿主机映射端口跟容器内 listen 端口对齐；空则默认 8090
          BOT_PORT=\$(grep -E '^BOT_INTERNAL_API_PORT=' "\$ENV_FILE" | tail -1 | sed -E 's/^[^=]*=//' | tr -d '[:space:]')
          BOT_PORT="\${BOT_PORT:-8090}"
          echo "[deploy] internal API 监听端口: \$BOT_PORT（仅 127.0.0.1）"

          # 双重 env 注入（跟 hfut 一致，参考其 deploy.yml 注释）：
          #   --env-file /tmp/.env.qq-bot.docker：容器启动时 docker daemon 把 KEY=VAL 注入进程 environ
          #     （这是一次性快照，之后改宿主 /qq-bot-server/.env 不会影响已跑容器进程）
          #   -v /qq-bot-server/.env:/.env:ro：把宿主 .env 挂进容器内 /.env
          #     → conf.envFileCandidates 包含 /.env，bot 启动期 godotenv.Load 会读到；
          #     → 运行期改宿主 /qq-bot-server/.env + kill -HUP <容器内 PID> 触发 godotenv.Overload
          #       重读 /.env 覆盖 environ，热更新 hot-swappable 字段（详见 conf/conf.go 注释）
          docker run -d --name qq-bot-server \
            --restart unless-stopped \
            --env-file /tmp/.env.qq-bot.docker \
            -p "127.0.0.1:\${BOT_PORT}:\${BOT_PORT}" \
            -v /qq-bot-server/cache:/tmp/qq-bot \
            -v /qq-bot-server/.env:/.env:ro \
            "qq-bot-server:${TAG}"

          sleep 3
          if ! docker ps --filter name=qq-bot-server --filter status=running -q | grep -q .; then
            echo '::error::容器启动失败'
            docker logs qq-bot-server 2>&1 || true
            exit 1
          fi
          echo '=== 部署成功 ==='
          docker image prune -f
          docker ps --filter name=qq-bot-server
          docker logs --tail 30 qq-bot-server
          EOF
