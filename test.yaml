# 日志相关配置
log:
  std_out_log_level: debug #输出到标准输出的log等级(debug/info/warn/error)
  log_level: debug #输出到日志的log等级(debug/info/warn/error)
  log_file: "" #日志文件路径，留空时默认使用 系统临时目录/qq-bot/logs/qq-bot.log

# api相关配置（NapCat HTTP + WebSocket 服务）
server:
  # NapCat HTTP 接口地址，结尾必须带 / —— 用来调 send_group_msg / get_group_list 等 action
  # 优先用反代 https://bot-http.xiaoen.xyz/，无法访问时换 https://cat.xiaoen.xyz:3000/
  address: "https://bot-http.xiaoen.xyz/"
  # NapCat WebSocket Server 地址 —— bot 作为客户端 dial 过去，所有群消息事件都从这里推过来
  # 这是接收消息的唯一入口；之前用 /get_group_msg_history 轮询的方案已弃用
  ws_address: "wss://bot-ws.xiaoen.xyz/"
  # HTTP server 鉴权 token（NapCat WebUI -> 网络配置 -> HTTP 服务器）；留空则不带 Authorization
  access_token: "http-theo5970"
  # WS server 鉴权 token（NapCat WebUI -> 网络配置 -> WebSocket 服务器）
  # 注意：NapCat 把 HTTP / WS 当两个独立网络适配器，每个有各自的 token
  # 留空时回退到上面的 access_token；如果两边一致写一个就行
  ws_access_token: "ws-theo5970"

# pixiv 相关配置
pixiv:
  pixiv_address: "https://image.anosu.top/pixiv/json" #pixiv api请求地址
  size: origin #大小【原图】

# 群聊相关配置
#
# WS 模式下，bot 监听 NapCat push 过来的事件流，"哪些群"完全由 NapCat 那边的群成员关系决定，
# 这里 group_id 留空即可（仅用于启动时打印一下方便排查）。
#
# 老的轮询参数 get_group_history_interval / update_group_list_interval / retry 已弃用，
# yaml 里写了也会被静默忽略。
group:
  group_id: # 想限定监听范围时填，留空 = bot 加入的所有群都会收消息
  # 例：
  # - 1234567889674
  # - 6546945464656
  # - 5454563523341

# 用户相关配置
user:
  user_id: # qqbot用户id，为空则自动获得当前bot账号

# 缓存相关配置
# 注：默认全部放在 系统临时目录/qq-bot/ 下（Linux: /tmp/qq-bot；Windows: %TEMP%/qq-bot），不再污染工作目录
# 留空即按默认值；要自定义直接填绝对路径
cache:
  tmp_dir: "" # jm/pix 下载缓存目录，留空 -> os.TempDir/qq-bot/jm
  pdf_tmp_dir: "" # 图片合成 pdf 的缓存目录，留空 -> os.TempDir/qq-bot/pdf
  max_size: 1024 # [单位:MB]缓存最大值
  clear_interval: 1200 # [单位:秒]清理缓存间隔时间，间隔越少，缓存清理越及时，但是会阻塞文件操作

# 跨平台外部工具命令路径
# 留空时按 OS 自动选择：
#   Windows: ./package/jmcomic.exe / ./package/img2pdf.exe
#   Linux  : jmcomic / img2pdf  (容器里 pip install 后在 PATH)
# 也可在生产部署时通过环境变量 TOOLS_JMCOMIC_BIN / TOOLS_IMG2PDF_BIN / TOOLS_PYTHON_BIN 覆盖
tools:
  jmcomic_bin: ""
  img2pdf_bin: ""
  python_bin: ""

# Kimi (Moonshot) 聊天配置
# - api_key 留空则不启用，CmdDefault 走原来的"打印菜单"行为
# - 生产推荐用环境变量 GPT_API_KEY（也兼容 MOONSHOT_KEY），不要把 key 写进 yaml
gpt:
  api_key: ""
  max_context_size: 40
  # system_prompt 留空使用代码内置的简洁牧濑红莉栖人设；想自定义的话直接覆盖
  system_prompt: ""
